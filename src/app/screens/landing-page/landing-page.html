<div class="landing-page">
    <header>
        <nav class="navbar">
            <div class="logo">
                <img src="/src/assets/images/logo-virtua.png" alt="Logo VC" class="logo-image">
            </div>
            <ul class="nav-links">
                <app-menu-item label="Home" route="/"></app-menu-item>
                <hr class="separator">
                <app-menu-item label="Features" route="/"></app-menu-item>
                <hr class="separator">
                <app-menu-item label="Pricing" route="/"></app-menu-item>
                <hr class="separator">
                <app-menu-item label="Contact" route="/"></app-menu-item>
            </ul>
        </nav>
    </header>

    <main>
        <div class="top-container">

                <h1>{{ title() }}</h1>

            </div>
